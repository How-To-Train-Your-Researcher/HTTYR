project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!tmp/"
  resources:
    - CNAME

website:
  title: "How To Train Your Researcher"
  site-url: https://httyr.com
  description: "Open-source advice for entering AI research."
  favicon: favicon.svg
  page-navigation: true
  page-footer:
    left: "Advice for entering AI research, maintained by volunteer researchers in Singapore."
    right:
      - text: GitHub
        href: https://github.com/How-To-Train-Your-Researcher/HTTYR
      - text: Singapore Youth AI
        href: https://sgyouthai.org/
  navbar:
    left:
      - href: EROP/index.qmd
        text: EROP
      - href: advice/reading_advice.qmd
        text: Reading Advice
      - href: advice/writing_advice.qmd
        text: Writing Advice
      - href: advice/lone_ranger.qmd
        text: Perspectives Advice
  sidebar:
    - title: "EROP 2026 (June)"
      style: docked
      contents:
        - EROP/index.qmd
        - EROP/research-brief.qmd
        - section: "Daily Plan"
          contents:
            - EROP/day-1.qmd
            - EROP/day-2.qmd
            - EROP/day-3.qmd
            - EROP/day-4.qmd
            - EROP/day-5.qmd
        - EROP/mentoring-strategy.qmd
  repo-url: https://github.com/How-To-Train-Your-Researcher/HTTYR
  repo-actions: [edit, issue]

language:
  title-block-published: "Updated"
  title-block-author-single: "Authors"
  title-block-author-plural: "Authors"

bibliography: references.bib
csl: https://www.zotero.org/styles/ieee

format:
  html:
    theme:
      light: [_theme/base.scss, _theme/light.scss]
      dark: [_theme/base.scss, _theme/dark.scss]
    respect-user-color-scheme: true
    include-in-header: _theme/fonts.html
    toc: true
    toc-depth: 3
    code-copy: true

editor:
  render-on-save: true